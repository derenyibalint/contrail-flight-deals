name: Check flight deals

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours, UTC
  workflow_dispatch: {}       # lets you trigger a run manually from GitHub's UI

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run flight_deals.py
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python flight_deals.py

      - name: Commit updated data
        run: |
          git config user.name "contrail-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json seen_deals.json
          git diff --staged --quiet || git commit -m "Update flight deal data [skip ci]"
          git push
